name: Build Docker Image

on:
  # Автоматическая сборка при релизе (создание tag вида v*)
  push:
    tags:
      - 'v*'
    branches:
      - main

  # Ручной запуск с возможностью указать NEXT_BASE_PATH
  workflow_dispatch:
    inputs:
      next_base_path:
        description: 'NEXT_BASE_PATH (e.g. /taskflow — leave empty for root)'
        required: false
        default: ''
        type: string
      image_tag:
        description: 'Custom image tag (leave empty for auto)'
        required: false
        default: ''
        type: string
      build_type:
        description: 'Build type (test/dev/release)'
        required: false
        default: test
        type: choice
        options:
          - test
          - dev
          - release

concurrency:
  # Serialize builds per ref: a new push waits for the running build to finish
  # instead of racing it (prevents a stale :test build from overwriting a newer one).
  # At most one running + one pending per group; older queued runs are superseded.
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.mrekin.ru
  IMAGE_NAME: ${{ gitea.repository }}
  KEEP_DEV_VERSIONS: 5

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.ACTIONS_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract repository name (lowercase)
        id: repo
        run: |
          REPO_LOWER=$(echo "${{ gitea.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${REPO_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Determine image tag
        id: meta
        run: |
          VERSION=$(grep '"version"' package.json | head -1 | sed -E 's/.*"version": "([^"]+)".*/\1/')
          VERSION="${VERSION#v}"
          REF="${GITEA_REF:-$GITHUB_REF}"
          if [ "${{ gitea.event_name }}" = "push" ]; then
            if [ "${REF#refs/tags/}" != "${REF}" ]; then
              BUILD_TYPE=release
              TAG="${REF#refs/tags/v}"
              TAGS="${{ steps.repo.outputs.image }}:${TAG}"$'\n'"${{ steps.repo.outputs.image }}:latest"
              BASE_PATH="/taskflow"
            else
              # Branch push. If this commit is also tagged, a tag-triggered release
              # build runs in parallel — skip this test build to avoid a duplicate.
              if [ -n "$(git tag --points-at HEAD)" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "Skipping branch build: commit is tagged (release build handles it)."
                exit 0
              fi
              if git diff --name-only ${{ gitea.event.before }} ${{ gitea.event.after }} | grep -q "package.json"; then
                if git diff ${{ gitea.event.before }} ${{ gitea.event.after }} package.json | grep -q '"version"'; then
                  BUILD_TYPE=dev
                  TAGS="${{ steps.repo.outputs.image }}:${VERSION}-dev"$'\n'"${{ steps.repo.outputs.image }}:test"
                else
                  BUILD_TYPE=test
                  TAGS="${{ steps.repo.outputs.image }}:test"
                fi
              else
                BUILD_TYPE=test
                TAGS="${{ steps.repo.outputs.image }}:test"
              fi
              BASE_PATH="/taskflow"
            fi
          else
            BUILD_TYPE="${{ inputs.build_type }}"
            if [ -n "${{ inputs.image_tag }}" ]; then
              TAGS="${{ steps.repo.outputs.image }}:${{ inputs.image_tag }}"
            elif [ "$BUILD_TYPE" = "release" ]; then
              TAGS="${{ steps.repo.outputs.image }}:${VERSION}"$'\n'"${{ steps.repo.outputs.image }}:latest"
            elif [ "$BUILD_TYPE" = "dev" ]; then
              TAGS="${{ steps.repo.outputs.image }}:${VERSION}-dev"$'\n'"${{ steps.repo.outputs.image }}:test"
            else
              TAGS="${{ steps.repo.outputs.image }}:test"
            fi
            BASE_PATH="${{ inputs.next_base_path }}"
          fi
          echo "tag<<EOF" >> "$GITHUB_OUTPUT"
          echo "${TAGS}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "base_path=${BASE_PATH}" >> "$GITHUB_OUTPUT"
          echo "build_type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.meta.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          build-args: |
            NEXT_BASE_PATH=${{ steps.meta.outputs.base_path }}
            BUILD_TYPE=${{ steps.meta.outputs.build_type }}
          cache-from: type=registry,ref=${{ steps.repo.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.repo.outputs.image }}:buildcache,mode=max

      - name: Cleanup old dev versions
        if: steps.meta.outputs.skip != 'true'
        run: |
          IMAGE="${{ steps.repo.outputs.image }}"
          REGISTRY="${{ env.REGISTRY }}"
          KEEP=${{ env.KEEP_DEV_VERSIONS }}
          CRED="${{ gitea.actor }}:${{ secrets.ACTIONS_TOKEN }}"

          # Get repository path for API calls
          REPO_PATH=$(echo "$IMAGE" | sed "s|${REGISTRY}/||")

          # Digest currently referenced by :test — its manifest is shared with the
          # newest -dev build, never delete it.
          TEST_DIGEST=$(curl -s -I -u "$CRED" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://${REGISTRY}/v2/${REPO_PATH}/manifests/test" \
            | grep -i "Docker-Content-Digest" | awk '{print $2}' | tr -d '\r')

          # Get all dev tags (X.Y.Z-dev), oldest first
          DEV_TAGS=$(curl -s -u "$CRED" \
            "https://${REGISTRY}/v2/${REPO_PATH}/tags/list" \
            | grep -o '"[0-9][0-9.]*-dev"' | tr -d '"' | sort -V)

          if [ -z "$DEV_TAGS" ]; then
            echo "No dev tags found, skipping cleanup"
            exit 0
          fi

          # Count and keep only last N versions
          TOTAL=$(echo "$DEV_TAGS" | wc -l)
          echo "Found ${TOTAL} dev tags, keeping latest ${KEEP}"

          if [ "$TOTAL" -le "$KEEP" ]; then
            echo "Not enough dev versions to cleanup"
            exit 0
          fi

          # Tags to delete (all except last KEEP)
          TO_DELETE=$(echo "$DEV_TAGS" | head -n $((TOTAL - KEEP)))
          echo "Dev tags to remove:"
          echo "$TO_DELETE"

          # Get digest for each tag and delete
          for TAG in $TO_DELETE; do
            DIGEST=$(curl -s -I -u "$CRED" \
              -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
              "https://${REGISTRY}/v2/${REPO_PATH}/manifests/${TAG}" \
              | grep -i "Docker-Content-Digest" | awk '{print $2}' | tr -d '\r')

            if [ -z "$DIGEST" ]; then
              echo "  Could not get digest for ${TAG}"
              continue
            fi

            if [ -n "$TEST_DIGEST" ] && [ "$DIGEST" = "$TEST_DIGEST" ]; then
              echo "  Skipping ${TAG}: manifest is referenced by :test"
              continue
            fi

            STATUS=$(curl -s -X DELETE -u "$CRED" -o /dev/null -w '%{http_code}' \
              "https://${REGISTRY}/v2/${REPO_PATH}/manifests/${DIGEST}")
            if [ "$STATUS" = "202" ] || [ "$STATUS" = "200" ]; then
              echo "  Deleted ${TAG} (digest: ${DIGEST})"
            else
              echo "  Failed to delete ${TAG} (HTTP ${STATUS})"
            fi
          done

          echo "Cleanup completed"
