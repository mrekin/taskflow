[project]
name = "taskflow-mcp"
version = "0.4.1"
description = "MCP server for TaskFlow (personal API tokens)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2,<2",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0",
]

[project.scripts]
taskflow-mcp = "taskflow_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskflow_mcp"]

[tool.ruff]
line-length = 100
